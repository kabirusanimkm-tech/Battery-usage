<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Quick Settings</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f6f9;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Android Quick Links</h2>

    <div class="btn-container">
        <!-- Open Settings -->
        <a href="intent:#Intent;action=android.settings.SETTINGS;end" class="btn">
            Open Android Settings
        </a>

        <!-- Go to Home Screen -->
        <a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end" class="btn">
            Go to Home Screen
        </a>
    </div>

</body>
</html>
