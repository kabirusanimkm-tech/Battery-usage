<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Quick Settings</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f6f9;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Android Quick Settings</h2>

    <div class="btn-container">
        <!-- 1. Open Settings -->
        <a href="intent:#Intent;action=android.settings.SETTINGS;end" class="btn">
            Open Settings
        </a>

        <!-- 2. Battery Usage -->
        <a href="intent:#Intent;action=android.intent.action.POWER_USAGE_SUMMARY;end" class="btn">
            Battery Used
        </a>

        <!-- 3. Developer Options / Special Access -->
        <a href="intent:#Intent;action=com.android.settings.APPLICATION_DEVELOPMENT_SETTINGS;end" class="btn">
            Special Access (Developer Options)
        </a>

        <!-- 4. Turn Off Cellular Data / Network Settings -->
        <a href="intent:#Intent;action=android.settings.DATA_ROAMING_SETTINGS;end" class="btn">
            Turn Off Cellular Data
        </a>

        <!-- 5. Android Setup -->
        <a href="intent:#Intent;action=android.provider.Settings.ACTION_INITIAL__SETTING;end" class="btn">
            Android Setup
        </a>
    </div>

</body>
</html>
