<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Settings Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Android Quick Settings</h2>

    <!-- 1. Google Open Settings -->
    <a class="btn" href="javascript:void(0)" onclick="window.location.href='intent:#Intent;action=com.google.android.gms.settings.GOOGLE_SETTINGS;category=android.intent.category.DEFAULT;end'">
       Google Open Settings
    </a>

    <!-- 2. Wallpaper Settings -->
    <a class="btn" href="javascript:void(0)" onclick="window.location.href='intent:#Intent;action=android.settings.WALLPAPER_SETTINGS;category=android.intent.category.DEFAULT;end'">
       Wallpaper Settings
    </a>

    <!-- 3. Security & Screen Lock Settings -->
    <a class="btn" href="javascript:void(0)" onclick="window.location.href='intent:#Intent;action=android.settings.SECURITY_SETTINGS;category=android.intent.category.DEFAULT;end'">
       Security & Screen Lock
    </a>

    <!-- 4. Background Apps & Special Usage Settings -->
    <a class="btn" href="javascript:void(0)" onclick="window.location.href='intent:#Intent;action=android.settings.IGNORE_BACKGROUND_DATA_RESTRICTIONS_SETTINGS;category=android.intent.category.DEFAULT;end'">
       Background App & Battery Optimization
    </a>

</body>
</html>
