<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android App Settings</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Saitin Apps Na Android</h2>
    <p>Zaɓi maballin da kake son amfani da shi:</p>
    
    <!-- Maballin Google Play Services -->
    <p>
        <a href="intent:#Intent;action=android.settings.APPLICATION_DETAILS_SETTINGS;package=com.google.android.gms;end" style="display: inline-block; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Bude Google Play Services</a>
    </p>

    <!-- Maballin Jerin Apps -->
    <p>
        <a href="intent:#Intent;action=android.settings.MANAGE_APPLICATIONS_SETTINGS;end" style="display: inline-block; padding: 12px 24px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Bude Jerin Apps</a>
    </p>
</body>
</html>
